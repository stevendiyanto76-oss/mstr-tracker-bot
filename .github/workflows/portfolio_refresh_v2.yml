name: V2 GitHub Audit Mirror

on:
  schedule:
    - cron: "20,50 * * * *"
      timezone: "Asia/Jakarta"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/portfolio_refresh_v2.yml"

permissions:
  contents: write

concurrency:
  group: v2-github-audit-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out audit repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch authoritative V2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            "https://mstr-challenge-v2-production.nevets-steven.workers.dev/api/v2/snapshot" \
            > /tmp/mstr-v2-snapshot.json

      - name: Validate and materialize sanitized audit mirror
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          snapshot_path = Path('/tmp/mstr-v2-snapshot.json')
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          if snapshot.get('schema_version') != 2:
              raise SystemExit('unsupported V2 snapshot schema')
          event_count = int(snapshot.get('event_count') or 0)
          latest_event_id = str(snapshot.get('latest_event_id') or '')
          if event_count < 12:
              raise SystemExit(f'V2 event count regressed: {event_count}')
          if not latest_event_id.startswith('CH-') or int(latest_event_id[3:]) < 12:
              raise SystemExit(f'V2 latest event regressed: {latest_event_id}')

          serialized = json.dumps(snapshot).lower()
          forbidden = (
              'private_source',
              'telegram_update_id',
              'telegram_message_id',
              'chat_id',
              'bot_token',
              'encrypted_payload',
          )
          leaked = [field for field in forbidden if field in serialized]
          if leaked:
              raise SystemExit('private fields in public snapshot: ' + ', '.join(leaked))

          documents = snapshot.get('documents')
          if not isinstance(documents, dict):
              raise SystemExit('V2 snapshot has no public documents')
          names = {
              'overview': 'challenge_overview.json',
              'transactions': 'challenge_transactions.json',
              'performance': 'challenge_performance.json',
              'thesis': 'challenge_thesis.json',
              'audit': 'challenge_audit.json',
              'health': 'challenge_health.json',
          }
          output = Path('data/public')
          output.mkdir(parents=True, exist_ok=True)
          for key, filename in names.items():
              payload = documents.get(key) or documents.get(f'challenge_{key}')
              if not isinstance(payload, dict):
                  raise SystemExit(f'V2 snapshot is missing {key}')
              if payload.get('schema_version') != 1:
                  raise SystemExit(f'{key} schema is unsupported')
              temporary = output / f'.{filename}.tmp'
              temporary.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              temporary.replace(output / filename)

          audit = documents.get('audit') or documents.get('challenge_audit') or {}
          ledger_hash = str(audit.get('ledger_hash') or audit.get('public_ledger_hash') or '')
          if len(ledger_hash) != 64:
              raise SystemExit('V2 audit document has no valid ledger hash')
          manifest = {
              'schema_version': 1,
              'role': 'backup_audit_mirror',
              'authority': 'V2_D1',
              'mirrored_at': datetime.now(timezone.utc).isoformat(),
              'snapshot_generated_at': snapshot.get('generated_at'),
              'event_count': event_count,
              'latest_event_id': latest_event_id,
              'ledger_hash': ledger_hash,
              'source_endpoint': 'mstr-challenge-v2-production',
          }
          (output / 'v2_authority_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Persist audit mirror without triggering writers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-public-mirror
          cp data/public/challenge_*.json /tmp/v2-public-mirror/
          cp data/public/v2_authority_manifest.json /tmp/v2-public-mirror/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/public
            cp /tmp/v2-public-mirror/challenge_*.json data/public/
            cp /tmp/v2-public-mirror/v2_authority_manifest.json data/public/
            git add data/public/challenge_*.json data/public/v2_authority_manifest.json
            if git diff --cached --quiet; then
              echo "V2 audit mirror is already current."
              exit 0
            fi
            git commit -m "chore: mirror authoritative V2 public snapshot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Unable to persist V2 audit mirror after retries." >&2
          exit 1
