name: MSTR Daily Tracker

on:
  push:
    branches: ["main"]
    paths:
      - "mstr_bot.py"
      - ".github/workflows/mstr_tracker.yml"

  schedule:
    # Setiap hari pukul 05:45 dan 19:45 WIB
    - cron: "45 5,19 * * *"
      timezone: "Asia/Jakarta"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mstr-daily-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Syntax Check
        run: python -m py_compile mstr_bot.py

      - name: Run MSTR Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mstr_bot.py

      - name: Persist MSTR State
        run: |
          if [ -f mstr_decision_engine_v2_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add mstr_decision_engine_v2_state.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: update MSTR engine state"
              git push
            fi
          fi
