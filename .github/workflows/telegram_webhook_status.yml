name: Telegram Webhook Status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram Webhook Info
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
          echo "Telegram Webhook Info:"
          python -c "
import json
data = json.loads('''$response''')
print(json.dumps(data, indent=2))
"
