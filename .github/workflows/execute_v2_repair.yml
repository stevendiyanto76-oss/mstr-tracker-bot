name: Execute V2 Repair

on:
  workflow_dispatch:
    inputs:
      commands_json:
        description: 'Optional JSON array of command objects (defaults to tools/repair_commands.json)'
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run repair script
        env:
          OWNER_ADMIN_TOKEN: ${{ secrets.OWNER_ADMIN_TOKEN }}
          COMMANDS_JSON: ${{ inputs.commands_json }}
        run: |
          python tools/execute_v2_repair.py
