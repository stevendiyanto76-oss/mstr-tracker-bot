name: Execute V2 Repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run repair script
        env:
          OWNER_ADMIN_TOKEN: ${{ secrets.OWNER_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSTR_WEB_SYNC_TOKEN: ${{ secrets.MSTR_WEB_SYNC_TOKEN }}
        run: |
          python tools/execute_v2_repair.py
