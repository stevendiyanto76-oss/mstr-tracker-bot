name: Portfolio Worker

on:
  schedule:
    - cron: "15 * * * *"
      timezone: "Asia/Jakarta"
    - cron: "30 5 * * *"
      timezone: "Asia/Jakarta"

  workflow_dispatch:
    inputs:
      mode:
        description: "Worker mode"
        type: choice
        required: true
        default: poll
        options:
          - poll
          - daily

  push:
    branches:
      - main
    paths:
      - "portfolio.py"
      - "challenge.py"
      - "tests/test_portfolio.py"
      - "tests/test_challenge.py"
      - "data/challenge_config.json"
      - "data/challenge_events.jsonl"
      - "data/challenge_snapshots.jsonl"
      - "data/mstr_disclosure_history.jsonl"
      - ".github/workflows/portfolio_worker.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-worker
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MSTR_WEB_SYNC_URL: ${{ secrets.MSTR_WEB_SYNC_URL }}
      MSTR_WEB_SYNC_TOKEN: ${{ secrets.MSTR_WEB_SYNC_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Compile Python modules
        run: python -m py_compile portfolio.py challenge.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate portfolio data
        run: python portfolio.py validate

      - name: Set stable public source revision
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git log -1 --format=%H -- portfolio.py challenge.py mstr.py mstr_decision_engine_v2_state.json)"
          echo "PUBLIC_SOURCE_COMMIT_SHA=$revision" >> "$GITHUB_ENV"

      - name: Prepare portfolio worker
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "30 5 * * *" ]]; then
            python portfolio.py prepare --daily-report
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.mode }}" == "daily" ]]; then
            python portfolio.py prepare --daily-report --force-report
          else
            python portfolio.py prepare
          fi

      - name: Validate sanitized public challenge exports
        run: |
          python portfolio.py export-public
          python portfolio.py validate-public
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "private_source",
              "telegram_update_id",
              "telegram_message_id",
              "chat_id",
              "bot_token",
          )
          for path in sorted(Path("data/public").glob("challenge_*.json")):
              content = path.read_text(encoding="utf-8").lower()
              matches = [item for item in forbidden if item in content]
              if matches:
                  raise SystemExit(f"private fields in {path}: {', '.join(matches)}")
          PY

      - name: Publish challenge data directly to website
        run: python portfolio.py sync-public

      - name: Persist portfolio state before flush
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-data/data
          cp data/transactions.jsonl /tmp/portfolio-data/data/transactions.jsonl
          cp data/portfolio_state.json /tmp/portfolio-data/data/portfolio_state.json
          cp data/portfolio_snapshots.jsonl /tmp/portfolio-data/data/portfolio_snapshots.jsonl
          cp data/challenge_config.json /tmp/portfolio-data/data/challenge_config.json
          cp data/challenge_events.jsonl /tmp/portfolio-data/data/challenge_events.jsonl
          cp data/challenge_snapshots.jsonl /tmp/portfolio-data/data/challenge_snapshots.jsonl
          cp data/mstr_disclosure_history.jsonl /tmp/portfolio-data/data/mstr_disclosure_history.jsonl
          mkdir -p /tmp/portfolio-data/data/public
          cp data/public/challenge_*.json /tmp/portfolio-data/data/public/

          persist_portfolio_data() {
            local message="$1"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main

              mkdir -p data
              cp /tmp/portfolio-data/data/transactions.jsonl data/transactions.jsonl
              cp /tmp/portfolio-data/data/portfolio_state.json data/portfolio_state.json
              cp /tmp/portfolio-data/data/portfolio_snapshots.jsonl data/portfolio_snapshots.jsonl
              cp /tmp/portfolio-data/data/challenge_config.json data/challenge_config.json
              cp /tmp/portfolio-data/data/challenge_events.jsonl data/challenge_events.jsonl
              cp /tmp/portfolio-data/data/challenge_snapshots.jsonl data/challenge_snapshots.jsonl
              cp /tmp/portfolio-data/data/mstr_disclosure_history.jsonl data/mstr_disclosure_history.jsonl
              mkdir -p data/public
              cp /tmp/portfolio-data/data/public/challenge_*.json data/public/

              git add \
                data/transactions.jsonl \
                data/portfolio_state.json \
                data/portfolio_snapshots.jsonl \
                data/challenge_config.json \
                data/challenge_events.jsonl \
                data/challenge_snapshots.jsonl \
                data/mstr_disclosure_history.jsonl \
                data/public/challenge_*.json

              if git diff --cached --quiet; then
                return 0
              fi

              git commit -m "$message"

              if git push origin HEAD:main; then
                return 0
              fi

              sleep $((attempt * 3))
            done

            return 1
          }

          persist_portfolio_data "chore: persist portfolio state [skip ci]"

      - name: Flush Telegram outbox
        id: flush
        continue-on-error: true
        run: python portfolio.py flush

      - name: Persist portfolio state after flush
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-data/data
          cp data/transactions.jsonl /tmp/portfolio-data/data/transactions.jsonl
          cp data/portfolio_state.json /tmp/portfolio-data/data/portfolio_state.json
          cp data/portfolio_snapshots.jsonl /tmp/portfolio-data/data/portfolio_snapshots.jsonl
          cp data/challenge_config.json /tmp/portfolio-data/data/challenge_config.json
          cp data/challenge_events.jsonl /tmp/portfolio-data/data/challenge_events.jsonl
          cp data/challenge_snapshots.jsonl /tmp/portfolio-data/data/challenge_snapshots.jsonl
          cp data/mstr_disclosure_history.jsonl /tmp/portfolio-data/data/mstr_disclosure_history.jsonl
          mkdir -p /tmp/portfolio-data/data/public
          cp data/public/challenge_*.json /tmp/portfolio-data/data/public/

          persist_portfolio_data() {
            local message="$1"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main

              mkdir -p data
              cp /tmp/portfolio-data/data/transactions.jsonl data/transactions.jsonl
              cp /tmp/portfolio-data/data/portfolio_state.json data/portfolio_state.json
              cp /tmp/portfolio-data/data/portfolio_snapshots.jsonl data/portfolio_snapshots.jsonl
              cp /tmp/portfolio-data/data/challenge_config.json data/challenge_config.json
              cp /tmp/portfolio-data/data/challenge_events.jsonl data/challenge_events.jsonl
              cp /tmp/portfolio-data/data/challenge_snapshots.jsonl data/challenge_snapshots.jsonl
              cp /tmp/portfolio-data/data/mstr_disclosure_history.jsonl data/mstr_disclosure_history.jsonl
              mkdir -p data/public
              cp /tmp/portfolio-data/data/public/challenge_*.json data/public/

              git add \
                data/transactions.jsonl \
                data/portfolio_state.json \
                data/portfolio_snapshots.jsonl \
                data/challenge_config.json \
                data/challenge_events.jsonl \
                data/challenge_snapshots.jsonl \
                data/mstr_disclosure_history.jsonl \
                data/public/challenge_*.json

              if git diff --cached --quiet; then
                return 0
              fi

              git commit -m "$message"

              if git push origin HEAD:main; then
                return 0
              fi

              sleep $((attempt * 3))
            done

            return 1
          }

          persist_portfolio_data "chore: flush portfolio outbox [skip ci]"

      - name: Fail if flush failed
        if: steps.flush.outcome == 'failure'
        run: exit 1
